[workspace]
resolver = "2"
members = ["crates/agent-adapter","crates/agent-worker","crates/daemon-core","crates/daemon-http","crates/fallback-outbox","crates/fleet","crates/ledger","crates/mcp-bridge","crates/mcp-tools","crates/peer-review","crates/shared-types","crates/triumvirate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.3.0", features = ["server", "macros", "transport-io", "transport-async-rw", "client"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.29"
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-client"] }
prometheus = "0.13"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
