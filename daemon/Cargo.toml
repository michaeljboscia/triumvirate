[workspace]
resolver = "2"
members = ["crates/agent-adapter","crates/agent-worker","crates/daemon-core","crates/daemon-http","crates/fallback-outbox","crates/fleet","crates/ledger","crates/mcp-bridge","crates/mcp-tools","crates/peer-review","crates/shared-types","crates/token-economics","crates/triumvirate","../pantheon/src-tauri","stress-tests/trace-capture"]

[workspace.package]
version = "3.9.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "Multi-agent AI coordination daemon for Claude, Gemini, and Codex"
repository = "https://github.com/michaeljboscia/triumvirate"
homepage = "https://github.com/michaeljboscia/triumvirate"
keywords = ["ai", "mcp", "agents", "llm", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "1.3.0", features = ["server", "macros", "transport-io", "transport-async-rw", "client", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.29"
opentelemetry = "0.28"
opentelemetry_sdk = "0.28"
# default-features=false is REQUIRED: otlp's defaults enable BOTH reqwest-client and
# reqwest-blocking-client, whose client-selection cfgs are mutually exclusive — with both
# on NEITHER matches and the exporter dies at init with "no http client". It must also be
# the BLOCKING client: OTEL's BatchProcessor runs on its own thread with no Tokio reactor,
# so an async client panics with "there is no reactor running".
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry-appender-tracing = "0.28"
prometheus = "0.13"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
