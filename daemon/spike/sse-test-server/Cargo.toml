[workspace]

[package]
name = "sse-test-server"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "1.3.0", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
axum = "0.8"
anyhow = "1"
