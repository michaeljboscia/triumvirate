name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libglib2.0-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Check
        run: cargo check --workspace --exclude pantheon
      - name: Clippy
        run: cargo clippy --workspace --exclude pantheon --all-targets -- -D warnings
      # Format check temporarily disabled — pre-existing unformatted code across
      # the workspace would fail this gate. Follow-up PR will run `cargo fmt --all`
      # and restore this step. Tracked separately from PR #29 to keep that PR
      # surgical.
      # - name: Format
      #   run: cargo fmt --all -- --check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libglib2.0-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # The ABE binary-oracle tests parse the argv Triumvirate builds against the REAL codex
      # binary (`codex exec <flags> --help`, no login needed). They fail loud when codex is
      # absent, on purpose: a skipped oracle is the quiet pass that let three dispatch surfaces
      # ship flags codex 0.154 rejects. Latest on purpose too, so a removed flag goes red here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install codex CLI for the binary oracle
        run: npm install -g @openai/codex && codex --version
      - name: Run unit tests
        run: cargo test --workspace --exclude pantheon --lib
      # The Temporal fleet engine's replay gate. An integration test, so `--lib` above never ran
      # it: a nondeterministic change to FleetWorkflow would have shipped green. Offline (it
      # replays a recorded history), no server needed.
      - name: FleetWorkflow replay gate
        run: cargo test -p fleet-temporal --test replay
      # The fleet crate's integration tests (fleet_agent_bin_pin pins how members are launched:
      # pinned binaries, commit grants, no operator args). Also integration tests, also skipped
      # by `--lib`. Each test file is its own process, which that file relies on.
      - name: Fleet integration tests
        run: cargo test -p fleet --tests
      # D-050: the daemon binary's own tests (about 320 in main.rs) and its integration files.
      # `--lib` never ran them: `triumvirate` is a bin target. Live-seat tests are #[ignore]d,
      # so this is offline; the codex oracle tests among them use the CLI installed above.
      - name: Daemon binary and integration tests
        run: cargo test -p triumvirate --tests

  # Seven Primes T-000 (REQ-010): the security floor the local validator enforces per task, re-run on the PR head.
  # Only for the feature PR; T-301 adds the live-evidence step and widens the trigger. gitleaks comes from its release
  # tarball checked against the release's own sha256, semgrep is pinned, and fetch-depth 0 gives origin/main..HEAD.
  seven-primes-floor:
    name: Seven Primes floor
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/seven-primes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install gitleaks 8.30.1 (pinned sha256)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && gitleaks version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep 1.157.0
        run: pip install semgrep==1.157.0 && semgrep --version
      - name: Security floor
        run: bash scripts/validate-seven-primes-task.sh --floor-only

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: triumvirate-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: triumvirate-aarch64-apple-darwin
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libglib2.0-dev protobuf-compiler
      # The Temporal SDK's build script needs protoc on every platform it builds on.
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p triumvirate
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: daemon/target/${{ matrix.target }}/release/triumvirate
