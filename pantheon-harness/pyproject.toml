[project]
name = "pantheon-harness"
version = "0.1.0"
description = "Test harness for Pantheon GCP validation gates"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "tiktoken>=0.8.0",
  "rich>=13.9.0",
  "google-cloud-storage>=2.18.0",
  "uvicorn>=0.30.0",
  "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
pantheon-harness = "pantheon_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
