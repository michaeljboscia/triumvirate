<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantheon</title>
    <!-- T-020 flicker fix: inline style block applies BEFORE any
         JS/CSS bundle loads, killing the default-white WKWebView
         paint gap. Pantheon is dark-only per REQ-029, so color-scheme
         is hard-pinned to dark — no prefers-color-scheme dance,
         no class-toggling at runtime, no re-paint triggers. -->
    <style>
      html {
        background-color: #1a1a1a;
        color-scheme: dark;
      }
      body {
        background-color: #1a1a1a;
        color: #f6f6f6;
        margin: 0;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
